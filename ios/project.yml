# XcodeGen spec for the iPhone app. The icon's source is AppIcon.svg (render to 1024px PNG).
# Regenerate the Xcode project after editing:
#   cd ios && xcodegen
name: NFCPlayer
options:
  bundleIdPrefix: com.orangeflow
  deploymentTarget:
    iOS: "17.0"
targets:
  NFCPlayer:
    type: application
    platform: iOS
    sources: [NFCPlayer]
    dependencies:
      - target: NFCPlayerShare
    scheme:
      testTargets: [NFCPlayerUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orangeflow.nfcplayer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: Q753P6JLVL
    entitlements:
      path: NFCPlayer/NFCPlayer.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
    info:
      path: NFCPlayer/Info.plist
      properties:
        CFBundleDisplayName: NFCMP
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: NFCMP finds your movie card player on your home network to search your media library.
        NFCReaderUsageDescription: NFCMP reads and writes your movie cards.
        CFBundleURLTypes:
          - CFBundleURLName: com.orangeflow.nfcplayer
            CFBundleURLSchemes: [nfcmp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NFCPlayerShare:
    type: app-extension
    platform: iOS
    sources: [NFCPlayerShare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orangeflow.nfcplayer.share
        PRODUCT_NAME: NFCMP
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q753P6JLVL
    info:
      path: NFCPlayerShare/Info.plist
      properties:
        CFBundleDisplayName: NFCMP
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  NFCPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NFCPlayerUITests]
    dependencies:
      - target: NFCPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orangeflow.nfcplayer.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q753P6JLVL
