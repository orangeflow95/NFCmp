# XcodeGen spec for the iPhone app. The icon's source is AppIcon.svg (render to 1024px PNG).
# Regenerate the Xcode project after editing:
#   cd ios && xcodegen
name: NFCPlayer
options:
  bundleIdPrefix: com.orangeflow
  deploymentTarget:
    iOS: "17.0"
targets:
  NFCPlayer:
    type: application
    platform: iOS
    sources: [NFCPlayer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orangeflow.nfcplayer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: Q753P6JLVL
    info:
      path: NFCPlayer/Info.plist
      properties:
        CFBundleDisplayName: NFCMP
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: NFCMP finds your movie card player on your home network to search your media library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
