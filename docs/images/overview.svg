<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1060 480' width='1060' height='480' font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><linearGradient id='orange' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ffa21f'/><stop offset='1' stop-color='#f2501c'/></linearGradient><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6e6e73'/></marker><marker id='arrow-o' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f2501c'/></marker></defs><rect width='1060' height='480' rx='16' fill='#ffffff'/><text x='30' y='44' font-size='22' font-weight='700' fill='#1d1d1f' text-anchor='start'>How the pieces talk to each other</text><text x='30' y='70' font-size='15' font-weight='400' fill='#6e6e73' text-anchor='start'>Pick a title on the phone, write it to a card, tap the card to play.</text><rect x='30' y='110' width='250' height='150' rx='14' fill='#f5f5f7' stroke='#c7c7cc' stroke-width='1.5'/><text x='48' y='142' font-size='17' font-weight='700' fill='#1d1d1f' text-anchor='start'>NFCMP app (iPhone)</text><text x='48' y='168' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Search your library + TMDB</text><text x='48' y='189' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Pick a title</text><text x='48' y='210' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Write to card</text><rect x='395' y='110' width='270' height='150' rx='14' fill='#fff4ee' stroke='#f2501c' stroke-width='2'/><text x='413' y='142' font-size='17' font-weight='700' fill='#1d1d1f' text-anchor='start'>Player (ESP32-S3)</text><text x='413' y='168' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>nfc-player.local</text><text x='413' y='189' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Writes + reads cards</text><text x='413' y='210' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Sends play commands</text><rect x='780' y='110' width='250' height='150' rx='14' fill='#f5f5f7' stroke='#c7c7cc' stroke-width='1.5'/><text x='798' y='142' font-size='17' font-weight='700' fill='#1d1d1f' text-anchor='start'>Roku TV</text><text x='798' y='168' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Turns on</text><text x='798' y='189' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Opens Netflix, Jellyfin…</text><text x='798' y='210' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Plays the title</text><rect x='395' y='330' width='270' height='120' rx='14' fill='#f5f5f7' stroke='#c7c7cc' stroke-width='1.5'/><text x='413' y='362' font-size='17' font-weight='700' fill='#1d1d1f' text-anchor='start'>Card (NTAG215)</text><text x='413' y='388' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Stores its own title:</text><text x='413' y='409' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>v1;svc=netflix;id=…</text><rect x='780' y='330' width='250' height='120' rx='14' fill='#f5f5f7' stroke='#c7c7cc' stroke-width='1.5'/><text x='798' y='362' font-size='17' font-weight='700' fill='#1d1d1f' text-anchor='start'>Jellyfin server</text><text x='798' y='388' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Library search</text><text x='798' y='409' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>What's playing</text><path d='M280 170 H393' stroke='#6e6e73' stroke-width='2' marker-end='url(#arrow)' fill='none'/><text x='336' y='160' font-size='13' font-weight='600' fill='#6e6e73' text-anchor='middle'>Wi-Fi</text><path d='M665 170 H778' stroke='#6e6e73' stroke-width='2' marker-end='url(#arrow)' fill='none'/><text x='721' y='160' font-size='13' font-weight='600' fill='#6e6e73' text-anchor='middle'>Roku ECP</text><path d='M530 262 V328' stroke='#f2501c' stroke-width='2.5' marker-end='url(#arrow-o)' marker-start='url(#arrow-o)' fill='none'/><text x='542' y='300' font-size='13' font-weight='600' fill='#f2501c' text-anchor='start'>tap (NFC)</text><path d='M665 380 H720 V200 H665' stroke='#c7c7cc' stroke-width='0' fill='none'/><path d='M778 390 H700 V262' stroke='#6e6e73' stroke-width='2' stroke-dasharray='6 5' marker-end='url(#arrow)' fill='none'/><text x='708' y='322' font-size='13' font-weight='600' fill='#6e6e73' text-anchor='start'>Wi-Fi</text></svg>