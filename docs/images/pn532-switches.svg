<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 430' width='880' height='430' font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><linearGradient id='orange' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#ffa21f'/><stop offset='1' stop-color='#f2501c'/></linearGradient><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6e6e73'/></marker><marker id='arrow-o' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#f2501c'/></marker></defs><rect width='880' height='430' rx='16' fill='#ffffff'/><text x='30' y='44' font-size='22' font-weight='700' fill='#1d1d1f' text-anchor='start'>Set the PN532 to I2C: switch 1 ON, switch 2 OFF</text><text x='30' y='70' font-size='15' font-weight='400' fill='#6e6e73' text-anchor='start'>The two small switches sit beside the chip. Flip them with power off.</text><rect x='110' y='110' width='220' height='250' rx='18' fill='#1565c0'/><text x='140' y='146' font-size='18' font-weight='700' fill='#fff' text-anchor='start'>ON</text><path d='M182 140 v-12 m0 0 l-7 8 m7 -8 l7 8' stroke='#fff' stroke-width='3' fill='none'/><rect x='160' y='165' width='50' height='150' rx='8' fill='#0d3c75'/><rect x='164' y='169' width='42' height='70' rx='6' fill='#fff'/><text x='185' y='342' font-size='20' font-weight='700' fill='#fff' text-anchor='middle'>1</text><rect x='240' y='165' width='50' height='150' rx='8' fill='#0d3c75'/><rect x='244' y='241' width='42' height='70' rx='6' fill='#fff'/><text x='265' y='342' font-size='20' font-weight='700' fill='#fff' text-anchor='middle'>2</text><text x='185' y='400' font-size='18' font-weight='700' fill='#1e8e3e' text-anchor='middle'>ON</text><text x='265' y='400' font-size='18' font-weight='700' fill='#d93025' text-anchor='middle'>OFF</text><rect x='420' y='110' width='420' height='190' rx='14' fill='#f5f5f7' stroke='#c7c7cc'/><text x='440' y='145' font-size='15' font-weight='700' fill='#1d1d1f' text-anchor='start'>Mode</text><text x='610' y='145' font-size='15' font-weight='700' fill='#1d1d1f' text-anchor='start'>Switch 1</text><text x='720' y='145' font-size='15' font-weight='700' fill='#1d1d1f' text-anchor='start'>Switch 2</text><text x='440' y='185' font-size='15' font-weight='400' fill='#1d1d1f' text-anchor='start'>HSU (serial)</text><text x='635' y='185' font-size='15' font-weight='600' fill='#1d1d1f' text-anchor='middle'>OFF</text><text x='745' y='185' font-size='15' font-weight='600' fill='#1d1d1f' text-anchor='middle'>OFF</text><rect x='428' y='199' width='404' height='38' rx='8' fill='#fff4ee' stroke='#f2501c' stroke-width='2'/><text x='440' y='225' font-size='15' font-weight='700' fill='#f2501c' text-anchor='start'>I2C  ← use this</text><text x='635' y='225' font-size='15' font-weight='600' fill='#1d1d1f' text-anchor='middle'>ON</text><text x='745' y='225' font-size='15' font-weight='600' fill='#1d1d1f' text-anchor='middle'>OFF</text><text x='440' y='265' font-size='15' font-weight='400' fill='#1d1d1f' text-anchor='start'>SPI</text><text x='635' y='265' font-size='15' font-weight='600' fill='#1d1d1f' text-anchor='middle'>OFF</text><text x='745' y='265' font-size='15' font-weight='600' fill='#1d1d1f' text-anchor='middle'>ON</text><text x='420' y='340' font-size='14' font-weight='400' fill='#6e6e73' text-anchor='start'>Some boards print 1/0 or H/L instead of ON/OFF:</text><text x='420' y='362' font-size='14' font-weight='600' fill='#1d1d1f' text-anchor='start'>I2C is “1 0” or “H L”.</text></svg>